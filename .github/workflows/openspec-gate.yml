# .github/workflows/openspec-gate.yml
#
# Core running the §18 change gate against itself.
#
# Adapted from the template this repo publishes at
# reference-implementations/openspec-change-gate/hooks/openspec-gate.ci.yml.
# Two deliberate divergences from that template, plus the hardening below:
#
#   1. It scores and runs reference-implementations/openspec-change-gate/
#      openspec-change-gate.sh, NOT bin/openspec-change-gate.sh. Core has no
#      bin/ — that was the HOST layout, and the four host repositories that used
#      it were deleted on 2026-08-12. The mapping between the two layouts lived
#      in reference-implementations/shared-install/resolve-core-artifact.sh,
#      published by THIS repo rather than owned by any host; it was retired in
#      the same change because those hosts were its only callers. The divergence
#      stands because the template still names bin/, not because a host still
#      reads it.
#
#   2. Core resolves its own WORKING-TREE copy rather than the shared install
#      at ~/.agenticapps/bin/. This is the exact inverse of the shim every
#      consuming project installs, and it is intentional: core is the source of
#      truth for these bytes. Gating core with a published copy tests whichever
#      host's installer ran last on that machine (the issue #32 race) and proves
#      nothing about what core ships. See ADR-0028 and docs/WORKFLOW.md.
#
# WHAT THIS JOB IS NOT: an enforced floor. core's `main` carries no branch
# protection and no rulesets, so a red run here does not prevent a merge. The
# job REPORTS. Making the check required is a repository setting, deliberately
# left outside the change that added this file. Do not describe it as a floor
# without first checking that the setting exists.
#
# REVIEWS DO NOT BLOCK, since gate 2.0.0. Missing, stale, unverifiable and
# REQUEST-CHANGES review evidence are each printed as a NOTE and none fails the
# job. Blocking is reserved for what is an ERROR rather than an ABSENCE: a spec
# delta that does not parse is wrong on its own terms.
name: OpenSpec change gate

# `pull_request`, NEVER `pull_request_target`. This job executes shell scripts
# from the working tree of the revision under test, so a fork's pull request
# supplies arbitrary code to the harness and the gate. Under `pull_request` that
# code runs with a read-only token and no access to repository secrets;
# `pull_request_target` would run the same fork-supplied shell with this
# repository's privileges. The trigger is the trust boundary.
on:
  pull_request:
  push:
    branches: [ main ]

# Least privilege: this job reads the tree and reports. It writes nothing.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      GATE: reference-implementations/openspec-change-gate/openspec-change-gate.sh
      HARNESS: tools/change-gate-conformance.sh
      # The scorer scores the gate; nothing scores the scorer. The harness is a
      # working-tree file run from the same checkout as its target, so a change
      # that deletes rows or inverts expected exit codes yields a green job while
      # certifying a drifting gate. Asserting a minimum row count closes that.
      # Raising this needs no ceremony. LOWERING IT REQUIRES A RECORDED DECISION
      # — removing obsolete rows is legitimate, so the floor must be able to
      # follow, but the number has to move deliberately and show in the diff.
      #
      # 71 -> 69 at spec 2.0.0. The two removed rows asserted GSD_SKIP_REVIEWS
      # behaviour — "hatch set -> allow" and "hatch set + validate RED -> block".
      # The variable is gone from the gate, so both rows asserted an interface
      # that no longer exists. They were NOT replaced with a row asserting the
      # variable is ignored: that would re-establish it as a name the gate knows,
      # which is the thing being removed. Row call sites are unchanged at 57 —
      # those two lines carried an env prefix and never matched that pattern.
      #
      # 69 -> 81 at gate 2.1.0. Twelve rows for the instruction-file pair —
      # section G — which is the gate's second blocking condition. Raising is
      # free, and this is the direction the comment above expects.
      MIN_SCORED_ROWS: "81"
      # A SECOND, INDEPENDENT FLOOR — on the harness SOURCE, not its output.
      # MIN_SCORED_ROWS is scraped from the harness's own stdout, so it bounds
      # only HONEST shrinkage: a stub that prints "TOTAL: 71 passed, 0 failed"
      # satisfies it while scoring nothing. Counting row call sites in the file
      # cannot be satisfied that way — the stub would have to carry 57 real row
      # invocations as well. Neither floor bounds row CORRECTNESS; see the
      # residual noted in the delta. Same rule as above: raising is free,
      # lowering takes a recorded decision.
      # 57 -> 69 at gate 2.1.0, one per section-G row.
      MIN_ROW_CALLSITES: "69"
    steps:
      - uses: actions/checkout@v7
        with:
          # Do not leave a credential in the workspace that working-tree shell
          # could reach.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      - name: Install OpenSpec (pinned)
        # Pinned, not floating. An unpinned global install lets an upstream
        # release change this job's verdict for an unchanged revision. 1.6.0 is
        # the version core validated against.
        run: npm i -g @fission-ai/openspec@1.6.0

      - name: Fail closed if the gate or the harness is missing
        # CI is the deliberate INVERSE of the local hooks. The PreToolUse hook
        # and the pre-commit hook fail OPEN on a missing gate, so absent tooling
        # cannot brick an editing session. Here an unanswerable question is a
        # defect, not a missing convenience.
        run: |
          for f in "$GATE" "$HARNESS"; do
            if [ ! -s "$f" ]; then
              echo "::error::required file missing or empty: $f"
              exit 1
            fi
          done

      - name: Prove the gate itself is conformant
        # A gate that has drifted can pass every repo it guards while enforcing
        # nothing (issue #32: five copies, none conformant). Score it before
        # trusting its verdict. Core is the first place this is possible: until
        # now the artifact core authors was scored only downstream, by hosts
        # that had already advanced a pin to it.
        run: |
          set -o pipefail
          bash "$HARNESS" "$GATE" | tee harness.out

      - name: Assert the harness actually scored something
        run: |
          line=$(grep -oE 'TOTAL: [0-9]+ passed' harness.out | tail -1) || true
          if [ -z "$line" ]; then
            echo "::error::harness produced no TOTAL line — cannot confirm it scored anything"
            exit 1
          fi
          rows=$(printf '%s' "$line" | grep -oE '[0-9]+')
          echo "harness scored $rows rows (floor: $MIN_SCORED_ROWS)"
          if [ "$rows" -lt "$MIN_SCORED_ROWS" ]; then
            echo "::error::harness scored $rows rows, below the recorded floor of $MIN_SCORED_ROWS."
            echo "::error::If rows were legitimately removed, lower MIN_SCORED_ROWS in this file"
            echo "::error::with a recorded decision — do not lower it silently."
            exit 1
          fi

      - name: Assert the harness source still defines its rows
        # Independent of anything the harness prints about itself.
        run: |
          sites=$(grep -cE '^[[:space:]]*run_row(_stderr_(has|lacks))?[[:space:]]' "$HARNESS") || sites=0
          echo "harness source defines $sites row call sites (floor: $MIN_ROW_CALLSITES)"
          if [ "$sites" -lt "$MIN_ROW_CALLSITES" ]; then
            echo "::error::harness source has $sites row call sites, below the recorded floor of $MIN_ROW_CALLSITES."
            echo "::error::A harness can print a passing TOTAL without running rows; this floor is the check"
            echo "::error::that does not take the harness's word for it. Lower it only with a recorded decision."
            exit 1
          fi

      - name: Test the PreToolUse wrapper and its registration
        # The wrapper runs on every edit, and both of its defects were SILENT
        # UNGATING — the one failure a gate may not have. Neither the harness
        # nor the installer suite executes it.
        run: bash tools/test-claude-hook-wrapper.sh

      - name: Test the hook installer
        # The harness above scores the GATE. It does not execute this
        # repository's own interposition points, and that gap is not academic:
        # CI reported 71/71 green while the installer carried four defects that
        # wrote into the working tree or destroyed a hook it did not own, each
        # exiting 0 and calling it success. Scoring the artifact core publishes
        # is not the same as testing the code core runs.
        run: bash tools/test-install-core-git-hooks.sh

      - name: Check spec placement, not just spec validity
        # `openspec validate` answers "does this parse". It cannot answer "is
        # every sentence in the requirement it belongs to". The archive fold at
        # 09f829e severed a paragraph across two requirements and validate
        # stayed green for three commits, because a torn sentence is
        # schema-valid. The line-multiset diff guarding that refactor proved
        # every line survived — which was true, and useless: every line did
        # survive, in the wrong requirement.
        run: bash tools/spec-placement.test.sh

      - name: Test the AGENTS.md conformance harness, both directions
        # This harness scores a host repo's shared instruction file. Core has
        # none: it is a spec repo carrying a CLAUDE.md, and CLAUDE.md is out of
        # scope by the very requirement the harness enforces. So "run it
        # against core itself" is unsatisfiable as stated, and substituting
        # CLAUDE.md would mean enforcing a rule the spec says does not apply.
        #
        # The honest substitute is to run it against fixtures in BOTH
        # directions on every push — a conformant layout must pass, and each
        # forbidden layout must fail. A harness only ever pointed at other
        # people's repos is one nothing here ever proves works, which is how
        # it shipped scoring an appended duplicate section green.
        run: bash tools/agents-md-conformance.test.sh

      - name: Score core's own shared instruction file, if it has one
        # Reported, never silently skipped. The day core gains an AGENTS.md —
        # the day a second agent is provisioned here — it gets scored, rather
        # than from whenever someone remembers to revisit this step.
        run: |
          if [ -f AGENTS.md ]; then
            bash tools/agents-md-conformance.sh AGENTS.md
          else
            echo "NOTE: core has no AGENTS.md, so there is nothing to score."
            echo "      CLAUDE.md is out of scope per spec §12 and is deliberately not substituted."
          fi

      - name: Test the installer-prerequisite harness, both directions
        # §21 scores host installers, which live in four other repos and write
        # to the operator's machine — the very act under discussion — so core
        # cannot run them. Fixtures are therefore the only place this harness
        # is ever exercised, and four of them reproduce the shapes actually on
        # disk: the unguarded `npm i -g`, the detect-and-instruct pair, the
        # `~/.agenticapps/bin/`-only write, and the repo-local write.
        #
        # Both directions on every push. A harness that fails everything is as
        # useless as one that passes everything, and pointing it only at the
        # broken shape would catch just the first.
        run: bash tools/installer-prereq-conformance.test.sh

      - name: Score core's own installer against §21
        # Core owns exactly one installer, and unlike the four host ones it is
        # core's to score. Shipping a contract core itself violates is a
        # failure this repo has already had, so the check runs here rather than
        # on a promise to remember.
        #
        # Not `if [ -f ]`-guarded: this file is core's, so its absence is a
        # defect and must fail rather than skip into a green run.
        run: bash tools/installer-prereq-conformance.sh tools/install-core-git-hooks.sh

      - name: Run the change gate
        # exit 0 = every active change validates (review NOTEs may still print);
        # exit 1 = `openspec validate --all` is red, or the openspec CLI is
        # missing so the question cannot be answered.
        run: bash "$GATE" --ci
