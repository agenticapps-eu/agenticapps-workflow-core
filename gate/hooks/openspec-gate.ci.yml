# .github/workflows/openspec-gate.yml
# The agent-agnostic enforcement floor in CI: every active change must validate + be reviewed.
name: OpenSpec change gate
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install OpenSpec
        run: npm i -g @fission-ai/openspec
      - name: Run the change gate
        run: bash gate/openspec-change-gate.sh --ci
        # exit 0 = all active changes validate and carry >=2 reviewers; exit 1 = block the PR.
